server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        # Image uploads (POST /api/assets) are capped at 2 MB by the
        # backend; nginx's own 1 MB default would refuse them first.
        client_max_body_size 3m;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        # Trusted here because this nginx is the only thing that can reach
        # the backend container (see docker-compose.yml) -- the backend
        # uses this to resolve auth.trusted_ips (docs/security.md).
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
